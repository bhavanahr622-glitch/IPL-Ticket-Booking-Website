
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Ticket Booking Form</title>
    <link rel="stylesheet" href="../CSS/styles.css">
</head>
<body>

    <header>
        <nav>
            <h2>IPL 2026</h2>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <main class="booking-main">
        <section id="booking">
            <h2>Ticket Booking Form</h2>

            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name"
                       required minlength="3" maxlength="50">

                <label for="email">Email:</label>
                <input type="email" id="email" name="email"
                       required>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone"
                       pattern="[0-9]{10}" maxlength="10"
                       title="Enter a 10-digit phone number" required>

                <label for="match">Select Match:</label>
                <select id="match" name="match" required>
                    <option value="" selected disabled>Select Match</option>
                    <option value="CSK vs MI">CSK vs MI</option>
                    <option value="RCB vs KKR">RCB vs KKR</option>
                    <option value="MI vs DC">MI vs DC</option>
                </select>

                <label for="category">Stand Category:</label>
                <select id="category" name="category" required>
                    <option value="" selected disabled>Select Category</option>
                    <option value="General">General</option>
                    <option value="Premium">Premium</option>
                    <option value="VIP">VIP</option>
                </select>

                <label for="quantity">Number of Tickets:</label>
                <input type="number" id="quantity" name="quantity"
                       min="1" max="10" required>

                <button type="submit">Submit</button>
                <button type="reset">Reset</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 IPL Ticket Booking. All Rights Reserved.</p>
    </footer>

</body>
</html>
